name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm qemu-system-x86
      - run: make
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: build/os.img
